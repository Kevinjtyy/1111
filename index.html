<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta name="screen-orientation" content="portrait">
<meta name="x5-orientation" content="portrait">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<meta name="browsermode" content="application">
<meta name="nightmode" content="disable">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>人格合成大作战 · 掉落合成</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffb545'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0c12;
    --panel:rgba(24,28,40,.72);
    --line:rgba(255,255,255,.10);
    --gold:#ffcf6b;
    --txt:#eef1f8;
    --dim:#9aa3b8;
    /* 先给普通值兜底：老内核不认识 env() 时会丢掉后一行，保留这一行 */
    --safe-t:0px;
    --safe-b:0px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  body{position:fixed;top:0;left:0;right:0;bottom:0;}
  #app{
    position:fixed;top:0;left:0;right:0;
    display:-webkit-box;display:-webkit-flex;display:flex;
    -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
    padding:calc(var(--safe-t) + 6px) 10px calc(var(--safe-b) + 6px);
    height:100vh;height:100dvh;
  }

  /* ---------- HUD ---------- */
  /* 说明：间距一律用 margin（不用 flex gap），以兼容 QQ/X5 等老内核 */
  #hud{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;flex:0 0 auto;}
  #hud > * + *{margin-left:8px;}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:5px 10px;min-width:64px;line-height:1.05;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .stat .k{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;}
  .stat .v{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#c9d3ea);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #hud .spacer{flex:1 1 auto;}
  #nextBox{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:4px 8px 4px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #nextBox .k{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-right:6px;}
  #nextCv{width:38px;height:38px;display:block;}
  .iconbtn{
    -webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);width:36px;height:36px;border-radius:12px;font-size:16px;line-height:1;
    display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
    -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;cursor:pointer;padding:0;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .iconbtn:active{transform:scale(.92);}
  .iconbtn.off{opacity:.42;}

  /* ---------- 舞台 ---------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;margin-top:8px;border-radius:9px;overflow:hidden;
    border:1px solid var(--line);background:#0d1018;box-shadow:0 10px 30px rgba(0,0,0,.5) inset;}
  #cv{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block;touch-action:none;}

  /* ---------- 合成链 ---------- */
  #chain{flex:0 0 auto;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
    -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin-top:7px;height:34px;}
  #chain > * + *{margin-left:3px;}
  #chain .node{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
    -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;position:relative;}
  #chain .node img{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block;
    box-shadow:0 0 0 2px var(--ring),0 2px 6px rgba(0,0,0,.5);}
  #chain .arw{color:#4d566e;font-size:11px;margin:0 1px;}
  #chain .cap{font-size:9.5px;color:var(--dim);margin-left:6px;letter-spacing:.02em;}

  /* ---------- 遮罩层 ---------- */
  #overlay{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;
    display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
    -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,rgba(30,36,56,.86),rgba(6,8,14,.95));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;
  }
  #overlay.hide{display:none;}
  .card{
    width:100%;max-width:360px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;
    background:linear-gradient(180deg,rgba(28,33,48,.96),rgba(16,19,28,.98));
    border:1px solid rgba(255,207,107,.28);border-radius:18px;padding:18px 16px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset;
  }
  .card h1{margin:0 0 2px;font-size:21px;letter-spacing:.04em;
    background:linear-gradient(180deg,#fff2d0,#ffb545);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card .sub{margin:0 0 14px;font-size:11px;color:var(--dim);letter-spacing:.14em;}
  .chainbig{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:end;-webkit-align-items:flex-end;align-items:flex-end;
    -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin:0 0 6px;-webkit-flex-wrap:wrap;flex-wrap:wrap;}
  .chainbig > * + *{margin-left:4px;}
  .chainbig .it{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;align-items:center;}
  .chainbig .it img{border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px var(--ring),0 3px 8px rgba(0,0,0,.5);}
  .chainbig .it span{font-size:8.5px;color:var(--dim);margin-top:3px;}
  .chainbig .arw{color:#5a6480;font-size:12px;padding-bottom:12px;}
  .rules{font-size:11.5px;line-height:1.75;color:#c3cbdd;text-align:left;margin:12px 2px 14px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:9px 11px;}
  .rules b{color:var(--gold);font-weight:700;}
  .rules .dot{color:var(--gold);}
  .btn{
    -webkit-appearance:none;appearance:none;width:100%;border:0;border-radius:14px;padding:13px 16px;
    font-size:16px;font-weight:800;letter-spacing:.12em;color:#2a1c00;cursor:pointer;
    background:linear-gradient(180deg,#ffe0a0,#ffb545);
    box-shadow:0 6px 18px rgba(255,181,69,.28);
    font-family:inherit;
  }
  .btn:active{transform:translateY(1px) scale(.995);}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none;
    font-size:13px;font-weight:600;letter-spacing:.08em;padding:10px;margin-top:8px;}
  .final{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin:4px 0 14px;}
  .final .box + .box{margin-left:10px;}
  .final .box{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px 6px;}
  .final .box .k{font-size:10px;color:var(--dim);letter-spacing:.1em;}
  .final .box .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;}
  .final .box .v.gold{color:var(--gold);}
  .newrec{display:inline-block;font-size:10.5px;color:#2a1c00;background:var(--gold);border-radius:999px;
    padding:2px 9px;margin-bottom:8px;font-weight:800;letter-spacing:.08em;}
  @media (max-height:620px){
    .card h1{font-size:18px;} .rules{font-size:10.5px;line-height:1.6;margin:8px 0 10px;}
    .chainbig .it img{width:30px;height:30px;}
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><span class="k">分数</span><span class="v" id="uiScore">0</span></div>
    <div class="stat"><span class="k">最高</span><span class="v" id="uiBest">0</span></div>
    <div class="spacer"></div>
    <div id="nextBox"><span class="k">NEXT</span><canvas id="nextCv" width="76" height="76"></canvas></div>
    <button class="iconbtn" id="btnSound" title="音效">🔊</button>
    <button class="iconbtn" id="btnRestart" title="重新开始">↻</button>
  </header>

  <div id="stage"><canvas id="cv"></canvas></div>

  <div id="chain"></div>

  <div id="overlay">
    <div class="card" id="card"><p class="sub" style="margin:22px 0 18px;letter-spacing:.2em">载 入 中 …</p></div>
  </div>
</div>

var raf = window.requestAnimationFrame
  ? function(cb){ return window.requestAnimationFrame(cb); }
  : function(cb){ return setTimeout(function(){ cb(Date.now()); }, 16); };

/* 椭圆：老内核没有 ctx.ellipse，用「变换 + arc」模拟 */
function ellipsePolyfill(cx, cy, rx, ry, rot, sa, ea, ccw){
  this.save();
  this.translate(cx, cy);
  if(rot) this.rotate(rot);
  this.scale(rx, ry || rx);
  this.arc(0, 0, 1, sa, ea, ccw);
  this.restore();
}
/* 注意：球体精灵用的是离屏 canvas（每次 resize 新建），所以必须补在原型上 */
function polyfillCanvas2D(){
  var proto = window.CanvasRenderingContext2D && window.CanvasRenderingContext2D.prototype;
  if(proto){
    if(!proto.ellipse) proto.ellipse = ellipsePolyfill;
    if(!proto.setLineDash) proto.setLineDash = function(){};
  }
}
/* 取不到原型时的兜底：至少保证当前上下文可用 */
function polyfillEllipse(c){ if(c && !c.ellipse) c.ellipse = ellipsePolyfill; }
function polyfillDash(c){ if(c && !c.setLineDash) c.setLineDash = function(){}; }

function fitApp(){
  var h = 0, de = document.documentElement;
  if(window.visualViewport && window.visualViewport.height) h = window.visualViewport.height;
  if(!h && window.innerHeight) h = window.innerHeight;

/* ================================================================
   音效（WebAudio，首次触摸时解锁）
   ================================================================ */
var Sound = {
  ac:null, on:true,
  init:function(){
    try{
      if(!this.ac){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) this.ac = new AC();
      }
      if(this.ac && this.ac.state === 'suspended') this.ac.resume();
    }catch(e){ this.ac = null; }
  },
  tone:function(freq, dur, type, vol, slide){
    if(!this.on || !this.ac) return;
    try{
      var t = this.ac.currentTime;
      var o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq*slide), t+dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  },
  drop:function(){ this.tone(180, 0.09, 'sine', 0.10, 0.7); },
  merge:function(tier){
    var f = 300 + tier*95;
    this.tone(f, 0.16, 'triangle', 0.13, 1.5);
    var self = this;
    setTimeout(function(){ self.tone(f*1.5, 0.12, 'sine', 0.07, 1.2); }, 55);
  },
  clear:function(){
    var self = this, seq = [520, 660, 830, 1040];
    seq.forEach(function(f,i){ setTimeout(function(){ self.tone(f, 0.22, 'triangle', 0.12, 1.1); }, i*70); });
  },
  over:function(){
    var self = this, seq = [420, 330, 250, 180];
    seq.forEach(function(f,i){ setTimeout(function(){ self.tone(f, 0.3, 'sawtooth', 0.075, 0.85); }, i*130); });
  }
};

/* ---------- 贴图与精灵缓存（离屏预渲染，移动端更省） ---------- */
var imgLoaded = 0, imgTotal = MAXT;
var textures = [];

function buildSprites(){
  R.sprites = [];
  var px = R.dpr * R.scale;
  for(var t=1; t<=MAXT; t++){
    var r  = TIERS[t].r;
    var ws = r*2*1.16;                       // 世界单位下的精灵边长（含外发光余量）
    var size = Math.max(8, Math.ceil(ws*px));
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var c = cv.getContext('2d');
    var s  = size/ws;                        // 像素/世界单位
    var R2 = r*s, C = size/2;
    var img = textures[t-1];

    c.save();
    c.beginPath(); c.arc(C,C,R2,0,TAU); c.clip();
    if(img && img.complete && img.naturalWidth) c.drawImage(img, C-R2, C-R2, R2*2, R2*2);
    else { c.fillStyle = TIERS[t].color; c.fillRect(C-R2,C-R2,R2*2,R2*2); }
    // 球体明暗
    var g = c.createRadialGradient(C-R2*0.34, C-R2*0.40, R2*0.08, C, C, R2*1.06);
    g.addColorStop(0,   'rgba(255,255,255,.26)');
    g.addColorStop(0.42,'rgba(255,255,255,0)');
    g.addColorStop(0.82,'rgba(0,0,0,.22)');
    g.addColorStop(1,   'rgba(0,0,0,.60)');
    c.fillStyle = g; c.fillRect(C-R2, C-R2, R2*2, R2*2);
    c.restore();
    // 高光
    c.save();
    c.beginPath();
    c.ellipse(C-R2*0.30, C-R2*0.42, R2*0.34, R2*0.19, -0.62, 0, TAU);
    c.fillStyle = 'rgba(255,255,255,.20)'; c.fill();
    c.restore();
    // 描边
    c.beginPath(); c.arc(C,C,Math.max(1,R2-1),0,TAU);
    c.lineWidth = Math.max(1.4, R2*0.075);
    c.strokeStyle = TIERS[t].color;
    c.globalAlpha = 0.92; c.stroke(); c.globalAlpha = 1;
    // 外发光（高等级更亮）
    if(t >= 3){
      c.beginPath(); c.arc(C,C,R2*1.03,0,TAU);
      c.lineWidth = Math.max(1, R2*0.07);
      c.strokeStyle = TIERS[t].color;
      c.globalAlpha = 0.16 + 0.06*t; c.stroke(); c.globalAlpha = 1;
    }
    R.sprites[t] = { cv:cv, ws:ws };
  }
}

function buildBackground(){
  R.bg = ctx.createLinearGradient(0,0,0,R.worldH);
  R.bg.addColorStop(0,   '#161d2e');
  R.bg.addColorStop(0.32,'#0e1320');
  R.bg.addColorStop(1,   '#080b13');
}

function resize(){
  var w = elStage.clientWidth, h = elStage.clientHeight;
  if(w < 10 || h < 10) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);   // 上限 2：老内核/中低端机更流畅
  R.w = w; R.h = h; R.dpr = dpr;
  elCv.width  = Math.round(w*dpr);
  elCv.height = Math.round(h*dpr);
  /* 世界尺寸按屏幕比例自适应：
     以 1120 世界高度为基准 → 限制板宽 [620,860] → 反推板高 [900,1500] → 再由板高与屏幕比例得出板宽。
     这样棋盘始终铺满画布（无黑边），且球与棋盘的相对大小在各机型上保持一致。 */
  var aspect = w/h;
  var ww = clamp(1120*aspect, 560, 860);
  var wh = clamp(ww/aspect, 900, 1400);
  R.worldW = wh*aspect;
  R.worldH = wh;
  R.scale  = w / R.worldW;
  /* 地面留白：让停在墙角的球不被舞台圆角裁切 */
  FLOOR_PAD = Math.max(24, R.worldW*0.06);
  buildBackground();
  buildSprites();
  // 边界内收束
  var floorY = R.worldH - FLOOR_PAD;
  for(var i=0;i<S.balls.length;i++){
    var b = S.balls[i];
    b.x = clamp(b.x, b.r, R.worldW-b.r);
    b.y = clamp(b.y, -400, floorY-b.r);
  }
  if(S.held) S.held.x = clamp(S.held.x, S.held.r, R.worldW-S.held.r);
  drawNextPreview();
}

/* ================================================================
   小球
   ================================================================ */
function makeBall(tier, x, y){
  var r = TIERS[tier].r;
  var m = r*r;                    // 质量 ∝ 半径²
  var I = 0.5*m*r*r;              // 圆盘转动惯量
  return {
    tier:tier, r:r, x:x, y:y,
    vx:0, vy:0, angle:0, av:0,
    m:m, invM:1/m, I:I, invI:1/I,
    age:0, spawnT:0, flash:0, removed:false
  };
}

function addBall(tier, x, y, vx, vy){
  var b = makeBall(tier, x, y);
  b.vx = vx||0; b.vy = vy||0;
  b.x = clamp(b.x, b.r, R.worldW-b.r);
  S.balls.push(b);
  return b;
}

function pickTier(){
  var t, sum = 0, acc = 0;
  for(t=1; t<DROP_W.length && t<=MAXT; t++) sum += DROP_W[t];
  if(sum <= 0) return 1;
  var r = Math.random()*sum;                  // 权重自动归一化
  for(t=1; t<DROP_W.length && t<=MAXT; t++){
    acc += DROP_W[t];
    if(r < acc) return t;
  }
  return 1;
}

/* ---------- 待掉落 ---------- */
function refillQueue(){
  while(S.queue.length < 3) S.queue.push(pickTier());
}

function spawnHeld(fromX){
  refillQueue();
  var tier = S.queue.shift();
  refillQueue();
  S.dropTier = tier;
  var b = makeBall(tier, fromX==null ? R.worldW/2 : fromX, HELD_Y);
  b.x = clamp(b.x, b.r, R.worldW-b.r);
  S.held = b;
  drawNextPreview();
}

function dropHeld(){
  if(!S.held || S.over || !S.running) return;
  var h = S.held;
  var b = addBall(h.tier, h.x, HELD_Y, 0, 120);
  b.spawnT = 1;
  S.held = null;
  Sound.drop();
  spawnHeld(b.x);
  // 轻微下压反馈
  S.shake = Math.max(S.shake, 1.2);
}

function drawNextPreview(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);   // 上限 2：老内核/中低端机更流畅
  var size = 38;
  elNext.width = elNext.height = Math.round(size*dpr);
  nctx.setTransform(dpr,0,0,dpr,0,0);
  nctx.clearRect(0,0,size,size);
  var tier = S.queue.length ? S.queue[0] : 1;
  var sp = R.sprites[tier];
  if(!sp) return;
  var pad = 1.5, box = size - pad*2;
  // 以球体实径占满预览框
  var target = box * (TIERS[tier].r / (sp.ws/2)) * 1.06;
  nctx.drawImage(sp.cv, size/2-target/2, size/2-target/2, target, target);
}

/* ================================================================
   物理
   ================================================================ */
function simStep(dt){
  var i, b, n = S.balls.length;
  for(i=0;i<n;i++){
    b = S.balls[i];
    b.vy += G*dt;
    var d = Math.max(0, 1 - AIR*dt);
    b.vx *= d; b.vy *= d;
    var sp2 = b.vx*b.vx + b.vy*b.vy;
    if(sp2 > MAXV*MAXV){ var k = MAXV/Math.sqrt(sp2); b.vx*=k; b.vy*=k; }
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.angle += b.av*dt;
    b.av *= Math.max(0, 1 - 0.9*dt);
    b.age += dt;
    if(b.spawnT < 1) b.spawnT = Math.min(1, b.spawnT + dt*4.5);
    if(b.flash  > 0) b.flash  = Math.max(0, b.flash - dt*3.2);
  }
  walls();
  for(i=0;i<ITER;i++) pairs(i===0);
}

function walls(){
  var i, b, floor = R.worldH - FLOOR_PAD, right = R.worldW;
  for(i=0;i<S.balls.length;i++){
    b = S.balls[i];
    if(b.x - b.r < 0){
      b.x = b.r;
      if(b.vx < 0) b.vx = -b.vx*WALL_E;
      b.vy *= 0.94; b.av += b.vy/(b.r*40);
    } else if(b.x + b.r > right){
      b.x = right - b.r;
      if(b.vx > 0) b.vx = -b.vx*WALL_E;
      b.vy *= 0.94; b.av -= b.vy/(b.r*40);
    }
    if(b.y + b.r > floor){
      b.y = floor - b.r;
      if(b.vy > 0) b.vy = -b.vy*WALL_E;
      if(Math.abs(b.vy) < 26) b.vy = 0;
      b.vx *= 0.90;
      b.av = b.av*0.55 + (b.vx/b.r)*0.45;
    }
    if(b.y - b.r < -900){ b.y = -900 + b.r; if(b.vy<0) b.vy = 0; }
  }
}

function pairs(checkMerge){
  var arr = S.balls, n = arr.length;
  for(var i=0;i<n;i++){
    var a = arr[i]; if(a.removed) continue;
    for(var j=i+1;j<n;j++){
      var b = arr[j]; if(b.removed) continue;
      var dx = b.x-a.x, dy = b.y-a.y;
      var rr = a.r + b.r;
      var d2 = dx*dx + dy*dy;
      if(d2 > rr*rr) continue;
      if(d2 < 1e-8){ dx = rand(-0.6,0.6); dy = rand(-0.6,0.6); d2 = dx*dx+dy*dy+1e-6; }
      var d = Math.sqrt(d2);
      var nx = dx/d, ny = dy/d;
      var pen = rr - d;

      // --- 位置修正 ---
      if(pen > SLOP){
        var corr = (pen - SLOP)*PERCENT/(a.invM + b.invM);
        a.x -= nx*corr*a.invM; a.y -= ny*corr*a.invM;
        b.x += nx*corr*b.invM; b.y += ny*corr*b.invM;
      }

      // --- 接触点 ---
      var px = a.x + nx*a.r, py = a.y + ny*a.r;
      var rix = px-a.x, riy = py-a.y;
      var rjx = px-b.x, rjy = py-b.y;

      // 接触点速度
      var vax = a.vx - a.av*riy, vay = a.vy + a.av*rix;
      var vbx = b.vx - b.av*rjy, vby = b.vy + b.av*rjx;
      var rvx = vax - vbx, rvy = vay - vby;
      var vn  = rvx*nx + rvy*ny;                    // >0 表示相互接近

      if(vn > 0){
        var e = (vn < BOUNCE_MIN) ? 0 : BALL_E;
        var rni = rix*ny - riy*nx, rnj = rjx*ny - rjy*nx;
        var invSum = a.invM + b.invM + rni*rni*a.invI + rnj*rnj*b.invI;
        var jn = (1+e)*vn/invSum;
        var Jx = nx*jn, Jy = ny*jn;
        a.vx -= Jx*a.invM; a.vy -= Jy*a.invM;
        b.vx += Jx*b.invM; b.vy += Jy*b.invM;
        a.av -= (rix*Jy - riy*Jx)*a.invI;
        b.av += (rjx*Jy - rjy*Jx)*b.invI;

        // --- 摩擦 ---
        var tx = rvx - nx*vn, ty = rvy - ny*vn;
        var tl = Math.sqrt(tx*tx + ty*ty);
        if(tl > 1e-4){
          tx /= tl; ty /= tl;
          var rti = rix*ty - riy*tx, rtj = rjx*ty - rjy*tx;
          var invSumT = a.invM + b.invM + rti*rti*a.invI + rtj*rtj*b.invI;
          var jt = tl/invSumT;
          var maxJt = MU*jn;
          if(jt > maxJt) jt = maxJt;
          var Fx = tx*jt, Fy = ty*jt;
          a.vx -= Fx*a.invM; a.vy -= Fy*a.invM;
          b.vx += Fx*b.invM; b.vy += Fy*b.invM;
          a.av -= (rix*Fy - riy*Fx)*a.invI;
          b.av += (rjx*Fy - rjy*Fx)*b.invI;
        }
      }

      // --- 合成判定 ---
      if(checkMerge && pen > -2 && a.tier === b.tier && a.age > 0.10 && b.age > 0.10){
        mergeQueue.push([a,b]);
      }
    }
  }
}

function processMerges(){
  if(!mergeQueue.length) return;
  var seen = [];
  for(var k=0;k<mergeQueue.length;k++){
    var a = mergeQueue[k][0], b = mergeQueue[k][1];
    if(a.removed || b.removed) continue;
    if(seen.indexOf(a) >= 0 || seen.indexOf(b) >= 0) continue;
    seen.push(a); seen.push(b);
    a.removed = true; b.removed = true;

    var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    var tier = a.tier;

    // 连击
    if(S.comboT > 0){ S.combo = Math.min(S.combo+1, 9); }
    else { S.combo = 1; }
    S.comboT = 1.15;
    var mult = 1 + 0.15*(S.combo-1);

    if(tier < MAXT){
      var nb = addBall(tier+1, mx, my, (a.vx+b.vx)*0.25, (a.vy+b.vy)*0.25 - 60);
      nb.flash = 1;
      burst(mx, my, TIERS[tier+1].color, 12 + tier*5, 260 + tier*40);
      S.rings.push({x:mx, y:my, r:TIERS[tier+1].r*0.5, max:TIERS[tier+1].r*2.6, life:1, color:TIERS[tier+1].color});
      addScore(pointOf(tier+1), mult, mx, my, null);
      Sound.merge(tier+1);
      S.shake = Math.max(S.shake, 1.6 + tier*1.7);
    } else {
      // 两只满级 → 烟花消除
      burst(mx, my, '#ffd166', 54, 620);
      burst(mx, my, TIERS[MAXT].color, 34, 420);
      S.rings.push({x:mx, y:my, r:20, max:TIERS[MAXT].r*4.2, life:1.25, color:'#ffd166'});
      addScore(CLEAR_POINTS, mult, mx, my, '烟花消除');
      Sound.clear();
      S.shake = Math.max(S.shake, 15);
    }
  }
  mergeQueue.length = 0;
  // 清理
  var out = [];
  for(var i=0;i<S.balls.length;i++) if(!S.balls[i].removed) out.push(S.balls[i]);
  S.balls = out;
}

/* ================================================================
   特效
   ================================================================ */
function burst(x, y, color, n, speed){
  speed = speed || 300;
  for(var i=0;i<n;i++){
    var a = rand(0, TAU), sp = rand(speed*0.25, speed);
    S.particles.push({
      x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
      life:1, max:rand(0.45, 0.95), size:rand(2.5, 6.5),
      color:color,
      spin:rand(-6,6), rot:rand(0,TAU)
    });
  }
}

function addScore(base, mult, x, y, label){
  var pts = Math.round(base*mult);
  S.score += pts;
  elScore.textContent = S.score;
  S.popups.push({
    x:x, y:y, life:1, max:0.95, text:'+'+pts, sub:label || (S.combo>1 ? ('x'+S.combo) : ''),
    color: label ? '#ffd166' : '#ffffff'
  });
}

function stepFx(dt){
  var i, p;
  for(i=S.particles.length-1;i>=0;i--){
    p = S.particles[i];
    p.vy += 1500*dt;
    p.vx *= 0.985;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += p.spin*dt;
    p.life -= dt/p.max;
    if(p.life <= 0) S.particles.splice(i,1);
  }
  for(i=S.rings.length-1;i>=0;i--){
    var r = S.rings[i];
    r.life -= dt*1.6;
    r.r += (r.max - r.r)*Math.min(1, dt*7);
    if(r.life <= 0) S.rings.splice(i,1);
  }
  for(i=S.popups.length-1;i>=0;i--){
    var q = S.popups[i];
    q.y -= 64*dt;
    q.life -= dt/q.max;
    if(q.life <= 0) S.popups.splice(i,1);
  }
  if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*46);
  if(S.comboT > 0){ S.comboT -= dt; if(S.comboT <= 0) S.combo = 0; }
}

/* ================================================================
   主循环
   ================================================================ */
var acc = 0, lastT = 0, rafId = 0;

function loop(t){
  rafId = raf(loop);
  if(!lastT) lastT = t;
  var dt = (t - lastT)/1000;
  lastT = t;
  if(!(dt > 0)) dt = 0;                  // 兼容个别内核时间戳回跳/异常
  if(dt > 0.25) dt = 0.25;               // 切后台回来不炸

  if(!S.paused){
    if(S.running && !S.over){
      acc += dt;
      var steps = 0;
      while(acc >= FIXED && steps < MAXSTEP){
        simStep(FIXED);
        processMerges();
        acc -= FIXED;
        steps++;
      }
      if(steps >= MAXSTEP) acc = 0;
      checkDanger(dt);
    }
    stepFx(dt);
  }
  render();
}

function checkDanger(dt){
  var bad = false;
  for(var i=0;i<S.balls.length;i++){
    var b = S.balls[i];
    if(b.age < 0.75) continue;
    if(b.y - b.r < DANGER_Y){ bad = true; break; }
  }
  if(bad){
    S.danger += dt;
    if(S.danger > 1.8) gameOver();
  } else {
    S.danger = Math.max(0, S.danger - dt*2.2);
  }
}

/* ================================================================
   渲染
   ================================================================ */
function render(){
  var w = R.worldW, h = R.worldH;
  ctx.setTransform(R.dpr*R.scale, 0, 0, R.dpr*R.scale, 0, 0);
  var sx = 0, sy = 0;
  if(S.shake > 0.15){
    sx = rand(-S.shake, S.shake)*0.6;
    sy = rand(-S.shake, S.shake)*1.2;
  }
  ctx.save();
  ctx.translate(sx, sy);

  // 背景
  ctx.fillStyle = R.bg || '#0d1018';
  ctx.fillRect(-20, -20, w+40, h+40);

  // 顶部掉落区（比下方略亮）
  ctx.fillStyle = 'rgba(255,255,255,.022)';
  ctx.fillRect(-20, -20, w+40, DANGER_Y+20);

  // 侧墙 / 地板
  var floorY = h - FLOOR_PAD;
  ctx.lineWidth = 2;
  var wallGrad = ctx.createLinearGradient(0,0,0,h);
  wallGrad.addColorStop(0,'rgba(120,150,220,.10)');
  wallGrad.addColorStop(1,'rgba(255,207,107,.16)');
  ctx.strokeStyle = wallGrad;
  ctx.beginPath();
  ctx.moveTo(1, -20); ctx.lineTo(1, floorY); ctx.lineTo(w-1, floorY); ctx.lineTo(w-1, -20);
  ctx.stroke();
  // 地面
  var fg = ctx.createLinearGradient(0, floorY, 0, h);
  fg.addColorStop(0, 'rgba(255,207,107,.22)');
  fg.addColorStop(1, 'rgba(255,207,107,.04)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, floorY, w, FLOOR_PAD + 2);

  // 死亡线
  var dz = S.danger;
  ctx.save();
  ctx.setLineDash([14, 12]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = dz > 0.02
    ? 'rgba(255,86,86,' + (0.35 + 0.6*Math.min(1, dz/1.8)) + ')'
    : 'rgba(255,255,255,.14)';
  ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(w, DANGER_Y); ctx.stroke();
  ctx.restore();

  // 待落球导轨
  if(S.held && S.running && !S.over){
    ctx.save();
    ctx.setLineDash([9, 13]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.beginPath();
    ctx.moveTo(S.held.x, HELD_Y + S.held.r + 4);
    ctx.lineTo(S.held.x, floorY - 3);
    ctx.stroke();
    ctx.restore();
  }

  // 拖尾光环
  for(var i=0;i<S.rings.length;i++){
    var rg = S.rings[i];
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, Math.max(0.5, rg.r), 0, TAU);
    ctx.lineWidth = 3 + 6*Math.max(0, rg.life);
    ctx.strokeStyle = rg.color;
    ctx.globalAlpha = Math.max(0, Math.min(1, rg.life))*0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 球
  for(i=0;i<S.balls.length;i++) drawBall(S.balls[i], 1);

  // 待落球
  if(S.held && S.running && !S.over){
    drawBall(S.held, 0.94);
    ctx.beginPath();
    ctx.arc(S.held.x, S.held.y, S.held.r + 5, 0, TAU);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5,7]);
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 粒子
  for(i=0;i<S.particles.length;i++){
    var p = S.particles[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    var s2 = p.size*(0.4 + 0.6*p.life);
    ctx.fillRect(-s2/2, -s2/2, s2, s2);
    ctx.restore();
  }

  // 分数飘字
  ctx.textAlign = 'center';
  for(i=0;i<S.popups.length;i++){
    var q = S.popups[i];
    var al = Math.max(0, Math.min(1, q.life*1.5));
    ctx.save();
    ctx.globalAlpha = al;
    ctx.font = '800 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.color;
    ctx.fillText(q.text, q.x, q.y);
    if(q.sub){
      ctx.font = '700 17px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.strokeText(q.sub, q.x, q.y - 26);
      ctx.fillStyle = '#ffd166';
      ctx.fillText(q.sub, q.x, q.y - 26);
    }
    ctx.restore();
  }

  // 连击提示
  if(S.combo > 1 && S.comboT > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, S.comboT*2.2);
    ctx.font = '800 34px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 5;
    var txt = 'COMBO x' + S.combo;
    ctx.strokeText(txt, w/2, DANGER_Y - 26);
    ctx.fillText(txt, w/2, DANGER_Y - 26);
    ctx.restore();
  }

  // 危险红晕
  if(S.danger > 0.05){
    var a2 = Math.min(0.5, S.danger/1.8*0.5);
    var vg = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.28, w/2, h/2, Math.max(w,h)*0.72);
    vg.addColorStop(0, 'rgba(255,0,0,0)');
    vg.addColorStop(1, 'rgba(255,30,30,' + a2 + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(-20,-20,w+40,h+40);
  }

  ctx.restore();
}

function drawBall(b, alpha){
  var sp = R.sprites[b.tier];
  if(!sp) return;
  var pop = 0.62 + 0.38*b.spawnT;          // 出生/合成弹一下
  var ws = sp.ws * pop;
  ctx.save();
  ctx.globalAlpha = alpha;
  // 阴影
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + b.r*0.86, b.r*0.86, b.r*0.24, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fill();
  // 本体
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  ctx.drawImage(sp.cv, -ws/2, -ws/2, ws, ws);
  ctx.restore();

  if(b.flash > 0){
    ctx.save();
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.98, 0, TAU); ctx.clip();
    ctx.globalAlpha = b.flash*0.8;
    ctx.fillStyle = '#fff';
    ctx.fillRect(b.x-b.r, b.y-b.r, b.r*2, b.r*2);
    ctx.restore();
  }
}

/* ================================================================
   输入
   ================================================================ */
var dragging = false;

function toWorldX(clientX){
  var rect = elCv.getBoundingClientRect();
  return (clientX - rect.left)/R.scale;
}

function moveHeld(clientX){
  if(!S.held) return;
  S.held.x = clamp(toWorldX(clientX), S.held.r + 2, R.worldW - S.held.r - 2);
}

/* 优先 Pointer Events；老内核（部分 QQ/X5）只有 Touch Events，则退回 touch/mouse */
var HAS_POINTER = !!window.PointerEvent;

function onDown(x, type, id){
  if(!S.running || S.over) return false;
  Sound.init();
  dragging = true;
  if(type !== 'touch' && elStage.setPointerCapture && id != null){
    try{ elStage.setPointerCapture(id); }catch(err){}
  }
  moveHeld(x);
  return true;
}
function onMove(x, type){
  if(!S.running || S.over) return;
  if(dragging || type === 'mouse') moveHeld(x);
}
function onUp(){
  if(!dragging) return;
  dragging = false;
  dropHeld();
}
function onCancel(){ dragging = false; }

if(HAS_POINTER){
  elStage.addEventListener('pointerdown', function(e){
    if(onDown(e.clientX, e.pointerType, e.pointerId)) e.preventDefault();
  }, {passive:false});
  elStage.addEventListener('pointermove', function(e){
    onMove(e.clientX, e.pointerType);
    if(dragging) e.preventDefault();
  }, {passive:false});
  elStage.addEventListener('pointerup', function(e){
    onUp();
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  elStage.addEventListener('pointercancel', onCancel, {passive:false});
} else {
  elStage.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    onDown(t.clientX, 'touch', null);
    e.preventDefault();
  }, {passive:false});
  elStage.addEventListener('touchmove', function(e){
    var t = e.changedTouches[0];
    onMove(t.clientX, 'touch');
    e.preventDefault();
  }, {passive:false});
  elStage.addEventListener('touchend', function(e){ onUp(); e.preventDefault(); }, {passive:false});
  elStage.addEventListener('touchcancel', onCancel, {passive:false});
  /* 桌面浏览器与老安卓的鼠标兜底 */
  elStage.addEventListener('mousedown', function(e){ onDown(e.clientX, 'mouse', null); e.preventDefault(); });
  elStage.addEventListener('mousemove', function(e){ onMove(e.clientX, 'mouse'); });
  document.addEventListener('mouseup', function(){ onUp(); });
}
elStage.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if(!S.running || S.over || !S.held) return;
  var step = 26;
  if(e.key === 'ArrowLeft'){ S.held.x = clamp(S.held.x - step, S.held.r+2, R.worldW-S.held.r-2); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ S.held.x = clamp(S.held.x + step, S.held.r+2, R.worldW-S.held.r-2); e.preventDefault(); }
  else if(e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter'){ dropHeld(); e.preventDefault(); }
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ S.paused = true; }
  else { S.paused = false; lastT = 0; acc = 0; }
});

/* ================================================================
   存档
   ================================================================ */
function loadStore(){
  try{
    var b = localStorage.getItem('ivmerge.best');
    if(b) S.best = parseInt(b,10) || 0;
    var m = localStorage.getItem('ivmerge.mute');
    if(m === '1'){ Sound.on = false; btnSound.classList.add('off'); btnSound.textContent = '🔇'; }
  }catch(e){}
  elBest.textContent = S.best;
}
function saveBest(){
  try{ localStorage.setItem('ivmerge.best', String(S.best)); }catch(e){}
}
function saveMute(){
  try{ localStorage.setItem('ivmerge.mute', Sound.on ? '0' : '1'); }catch(e){}
}

/* ================================================================
   界面：开始 / 结束
   ================================================================ */
function chainHTML(size, withName){
  var px = Math.max(24, size - Math.max(0, MAXT - 5) * 4);   // 等级多时自动缩小，避免撑破卡片
  var h = '<div class="chainbig">';
  for(var t=1;t<=MAXT;t++){
    if(t>1) h += '<div class="arw">▶</div>';
    h += '<div class="it" style="--ring:'+TIERS[t].color+'">'
       + '<img src="'+TEX[t]+'" style="width:'+px+'px;height:'+px+'px" alt="'+TIERS[t].name+'">'
       + (withName ? '<span>'+TIERS[t].name+'</span>' : '')
       + '</div>';
  }
  return h + '</div>';
}

function showStart(){
  S.running = false; S.over = false;
  elOver.classList.remove('hide');
  elCard.innerHTML =
    '<h1>人格合成大作战</h1>'
    + '<p class="sub">IDENTITY V · 掉落合成</p>'
    + chainHTML(40, true)
    + '<div class="rules">'
    + '<div><span class="dot">◆</span> 按住屏幕左右移动，<b>松手掉落</b></div>'
    + '<div><span class="dot">◆</span> 两只<b>相同</b>的球相撞 → 合成为下一只</div>'
    + '<div><span class="dot">◆</span> 顺序：<b>' + chainText() + '</b>，两只' + mark(MAXT) + '相撞触发烟花消除</div>'
    + '<div><span class="dot">◆</span> 球堆超过上方<b>虚线</b>太久即失败</div>'
    + '</div>'
    + '<button class="btn" id="btnStart">开 始 游 戏</button>'
    + '<button class="btn ghost" id="btnChainTip">合成链：' + mark(1) + TIERS[1].name + ' → ' + mark(MAXT) + TIERS[MAXT].name + '</button>';
  document.getElementById('btnStart').addEventListener('click', function(){
    Sound.init(); startGame();
  });
  var tip = document.getElementById('btnChainTip');
  if(tip) tip.addEventListener('click', function(){ Sound.init(); });
}

function showOver(){
  elOver.classList.remove('hide');
  var isNew = S.score > S.best;
  if(isNew){ S.best = S.score; saveBest(); elBest.textContent = S.best; }
  elCard.innerHTML =
    (isNew ? '<div class="newrec">新 纪 录</div>' : '')
    + '<h1>合 成 结 束</h1>'
    + '<p class="sub">再来一局挑战更高分</p>'
    + '<div class="final">'
    +   '<div class="box"><div class="k">本局分数</div><div class="v gold">'+S.score+'</div></div>'
    +   '<div class="box"><div class="k">历史最高</div><div class="v">'+S.best+'</div></div>'
    + '</div>'
    + chainHTML(30, false)
    + '<button class="btn" id="btnAgain" style="margin-top:14px">再 来 一 局</button>';
  document.getElementById('btnAgain').addEventListener('click', function(){
    Sound.init(); startGame();
  });
}

/* ================================================================
   流程
   ================================================================ */
function startGame(){
  elOver.classList.add('hide');
  S.balls = []; S.particles = []; S.popups = []; S.rings = [];
  mergeQueue.length = 0;
  S.score = 0; S.combo = 0; S.comboT = 0; S.danger = 0; S.shake = 0;
  S.over = false; S.running = true; S.paused = false;
  elScore.textContent = '0';
  S.queue = [];
  refillQueue();
  S.held = null;
  spawnHeld(R.worldW/2);
  acc = 0; lastT = 0;
}

function gameOver(){
  if(S.over) return;
  S.over = true; S.running = false;
  S.held = null;
  Sound.over();
  if(navigator.vibrate){ try{ navigator.vibrate([30,60,30]); }catch(e){} }
  setTimeout(showOver, 420);
}

btnSound.addEventListener('click', function(){
  Sound.init();
  Sound.on = !Sound.on;
  btnSound.textContent = Sound.on ? '🔊' : '🔇';
  if(Sound.on) btnSound.classList.remove('off'); else btnSound.classList.add('off');
  saveMute();
});

btnReset.addEventListener('click', function(){
  Sound.init();
  if(S.running){ startGame(); }
  else { showStart(); }
});

/* ================================================================
   自适应
   ================================================================ */
var rt = 0;
function onResize(){
  fitApp();                                  /* 先按实测视口高度重排，再重算画布 */
  clearTimeout(rt);
  rt = setTimeout(function(){ fitApp(); resize(); }, 60);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 120); });
window.addEventListener('pageshow', onResize);
window.addEventListener('load', onResize);
if(window.ResizeObserver){ new ResizeObserver(onResize).observe(elStage); }
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', onResize);
  window.visualViewport.addEventListener('scroll', onResize);
}
fitApp();
setTimeout(onResize, 300);      /* QQ/X5 工具条收起后再校准一次 */
setTimeout(onResize, 1200);

/* ================================================================
   测试用机器人：?auto=1 自动掉落
   ================================================================ */
function startBot(){
  setInterval(function(){
    if(!S.running || S.over || !S.held) return;
    var margin = S.held.r + 6;
    S.held.x = rand(margin, Math.max(margin+1, R.worldW - margin));
    dropHeld();
  }, 620);
}

/* ================================================================
   启动
   ================================================================ */
function afterTextures(){
  fitApp();
  resize();
  loadStore();
  setTimeout(function(){ fitApp(); resize(); }, 400);
  setTimeout(function(){ fitApp(); resize(); }, 1500);
  // 底部合成链
  var html = '';
  for(var t=1;t<=MAXT;t++){
    if(t>1) html += '<div class="arw">▶</div>';
    html += '<div class="node" style="--ring:'+TIERS[t].color+'"><img src="'+TEX[t]+'" alt="'+TIERS[t].name+'"></div>';
  }
  html += '<div class="cap">相同相撞即升级</div>';
  elChain.innerHTML = html;

  showStart();

  var auto = /[?&]auto=1/.test(location.search);
  if(auto){
    setTimeout(function(){ startGame(); startBot(); }, 120);
  }
  rafId = raf(loop);
}

var pending = MAXT;
for(var t=1;t<=MAXT;t++){
  (function(t){
    var im = new Image();
    im.onload = im.onerror = function(){ if(--pending === 0) afterTextures(); };
    im.src = TEX[t];
    textures[t-1] = im;
  })(t);
}

})();
</script>
</body>
</html>
